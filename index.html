<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>进贤仓历史文化街区项目汇报</title>
<style>
:root{--gold:#d8ad63;--gold2:#f3d8aa;--ivory:#f7efe2;--muted:#dccdb8;--rail:min(88vw,1480px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070605;color:var(--ivory);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.deck,.slide{position:absolute;inset:0}.slide{opacity:0;pointer-events:none;transition:opacity .5s ease}.slide.active{opacity:1;pointer-events:auto}
.bg{position:absolute;inset:0;background-image:var(--photo),linear-gradient(120deg,#070605,#15100b 55%,#24363a);background-size:cover;background-position:center;filter:saturate(1.18) brightness(.98) contrast(1.08);transform:scale(1.02)}
.slide.active .bg{animation:ken 9s ease both}.shade{position:absolute;inset:0;background:linear-gradient(100deg,rgba(0,0,0,.64),rgba(0,0,0,.22) 48%,rgba(0,0,0,.46)),linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.38))}
.texture{position:absolute;inset:0;opacity:.10;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:52px 52px}
.content{position:relative;z-index:2;height:100%;padding:6vh 4.5vw 11vh;display:flex;align-items:center;justify-content:center}
.frame{width:var(--rail);display:flex;flex-direction:column;gap:2.1vh}.frame.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:1.1vw}
.panel,.card,.num,.step{position:relative;background:linear-gradient(180deg,rgba(12,10,8,.74),rgba(10,8,6,.48));border:1px solid rgba(216,173,99,.42);box-shadow:0 22px 68px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,235,196,.16);backdrop-filter:blur(8px);border-radius:8px;overflow:hidden;cursor:pointer}
.panel:before,.card:before,.num:before,.step:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(243,216,170,.9),transparent)}
.panel{padding:2.6vh 1.55vw}.hero{width:min(76vw,1260px);text-align:center;margin:auto;padding:3.6vh 2.4vw}.feature{width:min(45vw,780px);margin-right:auto}
.meta{display:flex;justify-content:space-between;gap:2vw;margin-bottom:1.25vh;color:var(--gold2);font-size:1.22vh;font-weight:700}.kicker{letter-spacing:.14em}.page{border:1px solid rgba(216,173,99,.35);border-radius:999px;padding:.38vh .72vw;background:rgba(0,0,0,.24)}
h1{margin:0;font-size:5.35vh;line-height:1.08;font-weight:850;text-shadow:0 8px 28px rgba(0,0,0,.45)}h2{margin:1.2vh 0 0;font-size:2.05vh;line-height:1.48;font-weight:500;color:#f4eadc}p,li{font-size:1.43vh;line-height:1.62;color:var(--muted)}
.hero h1{font-size:6.4vh}.hero p{font-size:1.78vh}.tags{display:flex;gap:.65vw;justify-content:center;flex-wrap:wrap;margin-top:1.55vh}.tags span{padding:.48vh .85vw;border-radius:999px;background:rgba(216,173,99,.15);border:1px solid rgba(216,173,99,.32);font-size:1.24vh;color:#f6dfb6}
.grid{display:grid;gap:1.05vw;width:100%;align-items:stretch}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{padding:1.95vh 1.05vw;min-height:14vh}.card h3,.step h3{margin:.1vh 0 .65vh;color:var(--gold2);font-size:1.75vh}
.num{min-height:12.5vh;padding:1.75vh 1vw;display:flex;align-items:center;gap:.85vw}.num strong,.step strong{display:inline-flex;width:38px;height:38px;border-radius:50%;border:1px solid rgba(216,173,99,.55);align-items:center;justify-content:center;color:var(--gold2);background:rgba(0,0,0,.22)}
.num span{font-size:1.58vh;color:#f6dfb6;font-weight:760}.step{min-height:15vh;padding:1.85vh .95vw}.side-card{padding:2.1vh 1.25vw}
.controls{position:fixed;right:1.5vw;top:1.6vh;z-index:5;display:flex;gap:.55vw}.btn,.nav{border:1px solid rgba(216,173,99,.28);cursor:pointer;border-radius:999px;background:rgba(10,10,12,.54);backdrop-filter:blur(10px);color:var(--ivory)}.btn{padding:.76vh .9vw;font-size:1.2vh}.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;font-size:24px;z-index:5}.prev{left:1.1vw}.next{right:1.1vw}
.progress-wrap{position:fixed;left:0;right:0;bottom:66px;height:4px;background:rgba(255,255,255,.08);z-index:4}.progress{height:100%;background:linear-gradient(90deg,#263a42,#d8ad63,#f3d8aa);transition:.35s}
.thumbs{position:fixed;left:0;right:0;bottom:0;height:66px;background:rgba(8,8,8,.76);backdrop-filter:blur(12px);display:flex;gap:8px;overflow-x:auto;padding:8px 12px;z-index:4}.thumb{flex:0 0 auto;width:108px;border-radius:8px;border:2px solid transparent;background-image:var(--photo);background-size:cover;background-position:center;color:white;cursor:pointer;text-align:right;padding:0 7px 5px 0;font-size:12px}.thumb.active{border-color:var(--gold)}
.toc{position:fixed;left:0;top:0;bottom:0;width:min(420px,84vw);background:rgba(12,11,10,.94);backdrop-filter:blur(18px);box-shadow:20px 0 60px rgba(0,0,0,.35);transform:translateX(-102%);transition:.35s;z-index:8;padding:2.2vh 1.2vw}.toc.open{transform:translateX(0)}.toc-head{display:flex;justify-content:space-between;align-items:center}.toc-title{font-size:2.2vh;font-weight:800;color:var(--gold2)}.toc-close{border:0;background:0;color:white;font-size:28px;cursor:pointer}.toc-list{display:flex;flex-direction:column;gap:.55vh;margin-top:1vh;max-height:88vh;overflow:auto}.toc-item{text-align:left;border:1px solid rgba(216,173,99,.16);background:rgba(255,248,236,.05);padding:1.05vh .9vw;border-radius:8px;color:white;cursor:pointer}.toc-item span{display:inline-block;width:40px;color:var(--gold2)}.toc-item.active{border-color:rgba(216,173,99,.5);background:rgba(216,173,99,.1)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;z-index:7}.mask.show{opacity:1;pointer-events:auto}.transparent{background:transparent!important;backdrop-filter:none!important}.panel:hover,.card:hover,.num:hover,.step:hover{border-color:rgba(216,173,99,.78)}
@keyframes ken{from{transform:scale(1.045)}to{transform:scale(1)}}@media(max-width:1200px){.three,.four,.five{grid-template-columns:repeat(2,minmax(0,1fr))}.frame.split{grid-template-columns:1fr}.feature{width:min(70vw,980px)}}@media(max-width:760px){.content{padding:4vh 4vw 9vh}.frame,.hero,.feature{width:90vw}.three,.four,.five{grid-template-columns:1fr}h1{font-size:3.7vh}.hero h1{font-size:4.1vh}h2{font-size:1.78vh}.thumb{width:92px}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<button class="nav prev" id="prev" aria-label="上一页">‹</button>
<button class="nav next" id="next" aria-label="下一页">›</button>
<div class="controls"><button class="btn" id="menu">目录</button><button class="btn" id="home">封面</button><button class="btn" id="full">全屏</button></div>
<div class="progress-wrap"><div class="progress" id="progress"></div></div>
<div class="thumbs" id="thumbs"></div>
<div class="mask" id="mask"></div>
<aside class="toc" id="toc"><div class="toc-head"><div class="toc-title">目录 / 快速跳转</div><button class="toc-close" id="close">×</button></div><div class="toc-list" id="tocList"></div></aside>
<script>
const data=[
{t:'封面',k:'封面',h:'进贤仓',s:'全球首个“全维度城市年轮”历史街区',p:'南昌·进贤仓历史文化街区项目汇报｜2026年4月18日',type:'hero',img:'cover',tags:['城市年轮','真实硬核','活态地层']},
{t:'一、项目缘起',k:'一、项目缘起',h:'为何是进贤仓？',s:'国内文旅市场正在从“仿古观光”转向真实历史与深度文化体验。',type:'cards',img:'origin',items:[['历史价值，无可复制','地下4米深处叠压汉、唐、宋、元、明、清至今的完整城市年轮。'],['洪都之战，史诗底色','元末明初“洪都之战”古战场遗迹赋予街区铁血与荣光。'],['审美突围，正当其时','不再建造假古董，而是打造可触摸真实历史的硬核文化目的地。']]},
{t:'二、核心策划',k:'二、核心策划',h:'重构时空叙事',s:'将进贤仓从地理空间，升维为文化IP。',type:'side',img:'strategy',items:['核心IP定位：4米深处的城市年轮 × 1362年洪都之战。','空间叙事结构：尊重“河—仓—巷”的鱼骨状肌理。','文化定调原则：冷峻、工业、考古、真实。']},
{t:'三、建设蓝图',k:'三、建设蓝图',h:'五大视觉奇观',s:'新旧对撞，极致克制；用现代科技与材料悬浮历史。',type:'nums',img:'wonders',items:['时空裂缝','大地博物馆','悬浮粮仓','光之缝隙','逆流之柱']},
{t:'视觉奇观 01',k:'视觉奇观 01',h:'时空裂缝',s:'超白玻璃 + 生铁框架',p:'老残墙与透明材质形成极端对比，实现建筑的“灵魂修缮”，让历史与现代无声对话。',type:'feature',img:'crack'},
{t:'视觉奇观 02',k:'视觉奇观 02',h:'大地博物馆',s:'夯土墙 + 耐候钢',p:'半下沉式地堡入口如同从地里生长出来的“考古舱”，引导游客进入历史深层。',type:'feature',img:'museum'},
{t:'视觉奇观 03',k:'视觉奇观 03',h:'悬浮粮仓',s:'碳化木圆仓 + 玻璃地坪',p:'创造视觉上“消失的重力”，游客可俯瞰脚下4米深的漕运木轨，体验时空交错。',type:'feature',img:'granary'},
{t:'视觉奇观 04',k:'视觉奇观 04',h:'光之缝隙',s:'生铁框架嵌入',p:'在2米窄巷中“消隐”的书屋，不触碰任何一块古砖，让光线成为空间的灵魂。',type:'feature',img:'light'},
{t:'视觉奇观 05',k:'视觉奇观 05',h:'逆流之柱',s:'生铁编织装置塔',p:'带有机械美感的现代灯塔，在古老街巷中散发温暖的炭火光芒，成为精神地标。',type:'feature',img:'pillar'},
{t:'四、招商策略',k:'四、招商策略',h:'拒绝平庸，定制体验',s:'招商核心逻辑：前店后仓，科研级消费体验。',type:'cards',img:'leasing',items:[['准入机制','实行“一店一案”，所有品牌必须接受二次设计。'],['整体调性','业态、店面、材质、灯光均需符合仓储工业风。'],['招商底线','拒绝标准化连锁品牌，确保街区气质高度统一。']]},
{t:'主力业态策划',k:'主力业态策划',h:'四类主力业态',s:'以历史感、实验感与消费体验形成复合业态矩阵。',type:'cards',img:'formats',items:[['进贤实验室','赣菜供应链透明化，在“粮仓”里体验从田间到餐桌。'],['地下 Bar','唐代城墙遗迹上铺设玻璃地坪，与千年历史隔空对话。'],['文学驻地','依托小说IP，打造“时间囊”主题高端宿集。'],['手作金属工坊','复刻洪都之战冷兵器工艺，结合现代潮玩。']]},
{t:'五、运营模式',k:'五、运营模式',h:'动态造血，持续生长',s:'把建设过程本身转化为消费事件。',type:'cards',img:'operation',items:[['考古开放季','玻璃围幕探秘、城砖修复计划，让游客见证历史重现。'],['数字交互导览','利用AR在建筑立面还原1362年战场，让街区成为历史银幕。'],['医旅融合闭环','依托南昌第一医院区位，形成静谧修心与康养药膳运营区。']]},
{t:'六、推广计划',k:'六、推广计划',h:'定义“进贤仓色”',s:'以审美识别对传统古街形成降维打击。',type:'side',img:'marketing',items:['视觉符号系统：进贤仓蓝 × 生铁黑。','开仓大典：结合小说《进贤仓》情节，举办沉浸式开街仪式。','考古直播：将考古过程变为全民关注的连续剧。','硬核艺术周：邀请先锋建筑师与艺术家举办废墟艺术展。']},
{t:'七、执行框架',k:'七、执行框架',h:'五阶段工作执行框架',s:'以清晰交付物确保蓝图落地。',type:'time',img:'roadmap',items:[['策划期','《进贤仓IP物质化落位蓝图》'],['建设期','《五大视觉奇观技术可行性报告》'],['招商期','《前店后仓定制化招商手册》'],['运营期','《动态考古季：年度运营日历》'],['推广期','《进贤仓视觉识别系统VI》']]},
{t:'结语',k:'结语',h:'让历史说话，让城市生长',s:'进贤仓不是南昌的又一个“公园”。',p:'它是南昌在全国历史街区同质化竞争中，打出的一记名为“真实与硬核”的左勾拳。',type:'hero',img:'conclusion'},
{t:'愿景',k:'愿景',h:'外地人向往，本地人自豪，年轻人打卡',s:'为南昌城市软实力注入前所未有的力量。',p:'进贤仓将成为真实历史、硬核美学与当代消费共同生长的文化新地标。',type:'hero',img:'vision'},
{t:'致谢',k:'致谢',h:'汇报完毕',s:'敬请指导',p:'南昌·进贤仓历史文化街区项目汇报',type:'hero',img:'thanks'}
];
const deck=document.getElementById('deck'),thumbs=document.getElementById('thumbs'),tocList=document.getElementById('tocList');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const photo=img=>`url("assets/${img}.jpg")`;
function panel(x,i,cls='panel'){return `<div class="${cls}"><div class="meta"><span class="kicker">${esc(x.k)}</span><span class="page">${String(i+1).padStart(2,'0')} / ${data.length}</span></div><h1>${esc(x.h)}</h1><h2>${esc(x.s)}</h2>${x.p?`<p>${esc(x.p)}</p>`:''}${x.tags?`<div class="tags">${x.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}</div>`}
data.forEach((x,i)=>{
  let body='';
  if(x.type==='hero') body=`<div class="content"><div class="frame">${panel(x,i,'panel hero')}</div></div>`;
  else if(x.type==='feature') body=`<div class="content"><div class="frame">${panel(x,i,'panel feature')}</div></div>`;
  else if(x.type==='cards') body=`<div class="content"><div class="frame">${panel(x,i)}<div class="grid ${x.items.length===4?'four':'three'}">${x.items.map(c=>`<div class="card"><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p></div>`).join('')}</div></div></div>`;
  else if(x.type==='side') body=`<div class="content"><div class="frame split">${panel(x,i)}<div class="card side-card"><h3>核心要点</h3><ul>${x.items.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div></div></div>`;
  else if(x.type==='nums') body=`<div class="content"><div class="frame">${panel(x,i)}<div class="grid five">${x.items.map((c,n)=>`<div class="num"><strong>${n+1}</strong><span>${esc(c)}</span></div>`).join('')}</div></div></div>`;
  else body=`<div class="content"><div class="frame">${panel(x,i)}<div class="grid five">${x.items.map((c,n)=>`<div class="step"><strong>${String(n+1).padStart(2,'0')}</strong><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p></div>`).join('')}</div></div></div>`;
  deck.insertAdjacentHTML('beforeend',`<section class="slide ${i?'':'active'}" style='--photo:${photo(x.img)}' data-title="${esc(x.t)}"><div class="bg"></div><div class="shade"></div><div class="texture"></div>${body}</section>`);
  thumbs.insertAdjacentHTML('beforeend',`<button class="thumb ${i?'':'active'}" style='--photo:${photo(x.img)}' data-go="${i}">${String(i+1).padStart(2,'0')}</button>`);
  tocList.insertAdjacentHTML('beforeend',`<button class="toc-item ${i?'':'active'}" data-go="${i}"><span>${String(i+1).padStart(2,'0')}</span>${esc(x.t)}</button>`);
});
const slides=[...document.querySelectorAll('.slide')],ts=[...document.querySelectorAll('.thumb')],items=[...document.querySelectorAll('.toc-item')],bar=document.getElementById('progress'),toc=document.getElementById('toc'),mask=document.getElementById('mask');let idx=0;
function closeToc(){toc.classList.remove('open');mask.classList.remove('show')}
function show(i){idx=(i+slides.length)%slides.length;slides.forEach((x,n)=>x.classList.toggle('active',n===idx));ts.forEach((x,n)=>x.classList.toggle('active',n===idx));items.forEach((x,n)=>x.classList.toggle('active',n===idx));bar.style.width=(idx+1)/slides.length*100+'%';ts[idx].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});document.title=String(idx+1).padStart(2,'0')+'｜'+data[idx].t+'｜进贤仓历史文化街区';closeToc()}
function next(){show(idx+1)}function prev(){show(idx-1)}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('home').onclick=()=>show(0);document.getElementById('menu').onclick=()=>{toc.classList.add('open');mask.classList.add('show')};document.getElementById('close').onclick=closeToc;mask.onclick=closeToc;
document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
ts.forEach(x=>x.onclick=()=>show(+x.dataset.go));items.forEach(x=>x.onclick=()=>show(+x.dataset.go));
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))next();else if(['ArrowLeft','PageUp'].includes(e.key))prev();else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);else if(e.key==='Escape')closeToc()});
document.querySelectorAll('.panel,.card,.num,.step').forEach(x=>x.onclick=e=>{e.stopPropagation();const on=x.classList.contains('transparent');document.querySelectorAll('.transparent').forEach(y=>y.classList.remove('transparent'));if(!on)x.classList.add('transparent')});
document.addEventListener('click',e=>{if(!e.target.closest('.panel,.card,.num,.step'))document.querySelectorAll('.transparent').forEach(y=>y.classList.remove('transparent'))});
show(0);
</script>
</body>
</html>
