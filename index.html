<style>
:root{--gold:#d8ad63;--gold2:#f2d6a2;--ivory:#f5efe5;--muted:#d7c9b5}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080706;color:var(--ivory);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:.45s}.slide.active{opacity:1;pointer-events:auto}.bg{position:absolute;inset:0;background:radial-gradient(circle at 72% 20%,rgba(216,173,99,.25),transparent 32%),radial-gradient(circle at 22% 80%,rgba(37,55,71,.62),transparent 38%),linear-gradient(125deg,#070706,#15100c 45%,#243545);transform:scale(1.04);animation:ken 9s ease both}.slide:nth-child(3n) .bg{background:radial-gradient(circle at 75% 25%,rgba(81,115,131,.35),transparent 34%),linear-gradient(125deg,#080706,#17110d 48%,#101b24)}.slide:nth-child(3n+2) .bg{background:radial-gradient(circle at 30% 70%,rgba(216,173,99,.2),transparent 32%),linear-gradient(125deg,#050607,#10100d 45%,#1b2a2f)}.shade{position:absolute;inset:0;background:linear-gradient(100deg,rgba(7,7,7,.9),rgba(7,7,7,.55) 45%,rgba(7,7,7,.78))}.texture{position:absolute;inset:0;opacity:.09;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:52px 52px}.content{position:relative;z-index:2;height:100%;padding:6vh 4.5vw 11vh;display:flex;flex-direction:column;justify-content:center}.center{text-align:center;align-items:center}.panel,.card,.num,.step{background:linear-gradient(180deg,rgba(12,10,9,.52),rgba(12,10,9,.25));border:1px solid rgba(216,173,99,.3);border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.4);backdrop-filter:blur(10px);padding:2.2vh 1.4vw;cursor:pointer}.panel{width:min(88vw,1480px)}.hero{width:min(72vw,1250px);padding:3.2vh 2.2vw}.feature{width:min(44vw,780px)}.meta{display:flex;justify-content:space-between;gap:2vw;margin-bottom:1.3vh;color:var(--gold2);font-size:1.25vh;font-weight:700}.page{color:#dbc89d;border:1px solid rgba(216,173,99,.25);border-radius:999px;padding:.35vh .7vw}h1{margin:0;font-size:5.4vh;line-height:1.08;font-weight:850;text-shadow:0 8px 32px rgba(0,0,0,.3)}h2{margin:1.2vh 0 0;font-size:2.05vh;line-height:1.48;font-weight:500;color:#f0e5d4}p,li{font-size:1.45vh;line-height:1.62;color:var(--muted)}.hero h1{font-size:6.2vh}.tags{display:flex;gap:.65vw;justify-content:center;flex-wrap:wrap;margin-top:1.55vh}.tags span{padding:.48vh .85vw;border-radius:999px;background:rgba(216,173,99,.1);border:1px solid rgba(216,173,99,.22);font-size:1.25vh;color:#f3dfba}.grid{display:grid;gap:1.05vw;margin-top:2vh;width:min(88vw,1480px)}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}.five{grid-template-columns:repeat(5,1fr)}.split{grid-template-columns:1.2fr .8fr;align-items:start;width:min(86vw,1420px)}.card h3,.step h3{margin:.1vh 0 .65vh;color:var(--gold2);font-size:1.75vh}.num{min-height:12vh;display:flex;align-items:center;gap:.9vw}.num strong,.step strong{display:inline-flex;width:38px;height:38px;border-radius:999px;border:1px solid rgba(216,173,99,.42);align-items:center;justify-content:center;color:var(--gold2)}.controls{position:fixed;right:1.5vw;top:1.6vh;z-index:5;display:flex;gap:.55vw}.btn,.nav{border:1px solid rgba(216,173,99,.18);cursor:pointer;border-radius:999px;background:rgba(10,10,12,.48);backdrop-filter:blur(10px);color:var(--ivory)}.btn{padding:.76vh .9vw;font-size:1.2vh}.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;font-size:24px;z-index:5}.prev{left:1.1vw}.next{right:1.1vw}.progress-wrap{position:fixed;left:0;right:0;bottom:66px;height:4px;background:rgba(255,255,255,.08);z-index:4}.progress{height:100%;background:linear-gradient(90deg,#253747,#d8ad63,#f3d8aa);transition:.35s}.thumbs{position:fixed;left:0;right:0;bottom:0;height:66px;background:rgba(10,10,12,.72);backdrop-filter:blur(12px);display:flex;gap:8px;overflow-x:auto;padding:8px 12px;z-index:4}.thumb{flex:0 0 auto;width:108px;border-radius:10px;border:2px solid transparent;background:linear-gradient(135deg,#1a242a,#5c4627);color:white;cursor:pointer;opacity:.75}.thumb.active{border-color:var(--gold);opacity:1}.toc{position:fixed;left:0;top:0;bottom:0;width:min(420px,84vw);background:rgba(12,11,10,.94);backdrop-filter:blur(18px);box-shadow:20px 0 60px rgba(0,0,0,.35);transform:translateX(-102%);transition:.35s;z-index:8;padding:2.2vh 1.2vw}.toc.open{transform:translateX(0)}.toc-head{display:flex;justify-content:space-between;align-items:center}.toc-title{font-size:2.2vh;font-weight:800;color:var(--gold2)}.toc-close{border:0;background:0;color:white;font-size:28px}.toc-list{display:flex;flex-direction:column;gap:.55vh;margin-top:1vh}.toc-item{text-align:left;border:1px solid rgba(216,173,99,.12);background:rgba(255,248,236,.04);padding:1.1vh .9vw;border-radius:16px;color:white;cursor:pointer}.toc-item span{display:inline-block;width:40px;color:var(--gold2)}.toc-item.active{border-color:rgba(216,173,99,.4);background:rgba(216,173,99,.08)}.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;z-index:7}.mask.show{opacity:1;pointer-events:auto}.transparent{background:transparent!important;backdrop-filter:none!important}@keyframes ken{from{transform:scale(1.06)}to{transform:scale(1)}}@media(max-width:900px){.three,.four,.five,.split{grid-template-columns:1fr}.panel,.hero,.feature,.grid{width:90vw}h1{font-size:3.7vh}.hero h1{font-size:4vh}h2{font-size:1.8vh}.thumb{width:92px}}
</style>

<body><main id="deck"></main><button class="nav prev" id="prev">‹</button><button class="nav next" id="next">›</button><div class="controls"><button class="btn" id="menu">目录</button><button class="btn" id="home">封面</button><button class="btn" id="full">全屏</button></div><div class="progress-wrap"><div class="progress" id="progress"></div></div><div class="thumbs" id="thumbs"></div><div class="mask" id="mask"></div><aside class="toc" id="toc"><div class="toc-head"><div class="toc-title">目录 / 快速跳转</div><button class="toc-close" id="close">×</button></div><div class="toc-list" id="tocList"></div></aside>
<script>
const data=[['封面','封面','进贤仓','全球首个“全维度城市年轮”历史街区','南昌·进贤仓历史文化街区项目汇报｜2026年4月18日','hero',['城市年轮','真实硬核','活态地层']],['一、项目缘起','一、项目缘起','为何是进贤仓？','国内文旅市场正在从“仿古观光”转向真实历史与深度文化体验。','', 'cards', [['历史价值，无可复制','地下4米深处叠压汉、唐、宋、元、明、清至今的完整城市年轮。'],['洪都之战，史诗底色','元末明初“洪都之战”古战场遗迹赋予街区铁血与荣光。'],['审美突围，正当其时','不再建造假古董，而是打造可触摸真实历史的硬核文化目的地。']]],['二、核心策划','二、核心策划','重构时空叙事','将进贤仓从地理空间，升维为文化IP。','','side',['核心IP定位：4米深处的城市年轮 × 1362年洪都之战。','空间叙事结构：尊重“河—仓—巷”的鱼骨状肌理。','文化定调原则：冷峻、工业、考古、真实。']],['三、建设蓝图','三、建设蓝图','五大视觉奇观','新旧对撞，极致克制；用现代科技与材料悬浮历史。','','nums',['时空裂缝','大地博物馆','悬浮粮仓','光之缝隙','逆流之柱']],['视觉奇观 01','视觉奇观 01','时空裂缝','超白玻璃 + 生铁框架','老残墙与透明材质形成极端对比，实现建筑的“灵魂修缮”，让历史与现代无声对话。','feature'],['视觉奇观 02','视觉奇观 02','大地博物馆','夯土墙 + 耐候钢','半下沉式地堡入口如同从地里生长出来的“考古舱”，引导游客进入历史深层。','feature'],['视觉奇观 03','视觉奇观 03','悬浮粮仓','碳化木圆仓 + 玻璃地坪','创造视觉上“消失的重力”，游客可俯瞰脚下4米深的漕运木轨，体验时空交错。','feature'],['视觉奇观 04','视觉奇观 04','光之缝隙','生铁框架嵌入','在2米窄巷中“消隐”的书屋，不触碰任何一块古砖，让光线成为空间的灵魂。','feature'],['视觉奇观 05','视觉奇观 05','逆流之柱','生铁编织装置塔','带有机械美感的现代灯塔，在古老街巷中散发温暖的炭火光芒，成为精神地标。','feature'],['四、招商策略','四、招商策略','拒绝平庸，定制体验','招商核心逻辑：前店后仓，科研级消费体验。','','cards',[['准入机制','实行“一店一案”，所有品牌必须接受二次设计。'],['整体调性','业态、店面、材质、灯光均需符合仓储工业风。'],['招商底线','拒绝标准化连锁品牌，确保街区气质高度统一。']]],['主力业态策划','主力业态策划','四类主力业态','以历史感、实验感与消费体验形成复合业态矩阵。','','cards',[['进贤实验室','赣菜供应链透明化，在“粮仓”里体验从田间到餐桌。'],['地下 Bar','唐代城墙遗迹上铺设玻璃地坪，与千年历史隔空对话。'],['文学驻地','依托小说IP，打造“时间囊”主题高端宿集。'],['手作金属工坊','复刻洪都之战冷兵器工艺，结合现代潮玩。']]],['五、运营模式','五、运营模式','动态造血，持续生长','把建设过程本身转化为消费事件。','','cards',[['考古开放季','玻璃围幕探秘、城砖修复计划，让游客见证历史重现。'],['数字交互导览','利用AR在建筑立面还原1362年战场，让街区成为历史银幕。'],['医旅融合闭环','依托南昌第一医院区位，形成静谧修心与康养药膳运营区。']]],['六、推广计划','六、推广计划','定义“进贤仓色”','以审美识别对传统古街形成降维打击。','','side',['视觉符号系统：进贤仓蓝 × 生铁黑。','开仓大典：结合小说《进贤仓》情节，举办沉浸式开街仪式。','考古直播：将考古过程变为全民关注的连续剧。','硬核艺术周：邀请先锋建筑师与艺术家举办废墟艺术展。']],['七、执行框架','七、执行框架','五阶段工作执行框架','以清晰交付物确保蓝图落地。','','time',[['策划期','《进贤仓IP物质化落位蓝图》'],['建设期','《五大视觉奇观技术可行性报告》'],['招商期','《前店后仓定制化招商手册》'],['运营期','《动态考古季：年度运营日历》'],['推广期','《进贤仓视觉识别系统VI》']]],['结语','结语','让历史说话，让城市生长','进贤仓不是南昌的又一个“公园”。','它是南昌在全国历史街区同质化竞争中，打出的一记名为“真实与硬核”的左勾拳。','hero'],['愿景','愿景','外地人向往，本地人自豪，年轻人打卡','为南昌城市软实力注入前所未有的力量。','进贤仓将成为真实历史、硬核美学与当代消费共同生长的文化新地标。','hero'],['致谢','致谢','汇报完毕','敬请指导','南昌·进贤仓历史文化街区项目汇报','hero']];
const deck=document.getElementById('deck'),thumbs=document.getElementById('thumbs'),tocList=document.getElementById('tocList');function p(s,i,c='panel'){return `<div class="${c}"><div class="meta"><span>${s[1]}</span><span class="page">${String(i+1).padStart(2,'0')} / ${data.length}</span></div><h1>${s[2]}</h1><h2>${s[3]}</h2>${s[4]?`<p>${s[4]}</p>`:''}${s[6]&&s[5]=='hero'?`<div class="tags">${s[6].map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div>`}data.forEach((s,i)=>{let html='';if(s[5]=='hero')html=`<div class="content center">${p(s,i,'panel hero')}</div>`;else if(s[5]=='feature')html=`<div class="content">${p(s,i,'panel feature')}</div>`;else if(s[5]=='cards')html=`<div class="content">${p(s,i)}<div class="grid ${s[6].length==4?'four':'three'}">${s[6].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div>`;else if(s[5]=='side')html=`<div class="content"><div class="grid split">${p(s,i)}<div class="card"><h3>核心要点</h3><ul>${s[6].map(x=>`<li>${x}</li>`).join('')}</ul></div></div></div>`;else if(s[5]=='nums')html=`<div class="content">${p(s,i)}<div class="grid five">${s[6].map((x,n)=>`<div class="num"><strong>${n+1}</strong><span>${x}</span></div>`).join('')}</div></div>`;else html=`<div class="content">${p(s,i)}<div class="grid five">${s[6].map((x,n)=>`<div class="step"><strong>${String(n+1).padStart(2,'0')}</strong><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div>`;deck.insertAdjacentHTML('beforeend',`<section class="slide ${i?'':'active'}" data-title="${s[0]}"><div class="bg"></div><div class="shade"></div><div class="texture"></div>${html}</section>`);thumbs.insertAdjacentHTML('beforeend',`<button class="thumb ${i?'':'active'}" data-go="${i}">${String(i+1).padStart(2,'0')}</button>`);tocList.insertAdjacentHTML('beforeend',`<button class="toc-item ${i?'':'active'}" data-go="${i}"><span>${String(i+1).padStart(2,'0')}</span>${s[0]}</button>`)});
const slides=[...document.querySelectorAll('.slide')],ts=[...document.querySelectorAll('.thumb')],items=[...document.querySelectorAll('.toc-item')],bar=document.getElementById('progress'),toc=document.getElementById('toc'),mask=document.getElementById('mask');let idx=0;function closeToc(){toc.classList.remove('open');mask.classList.remove('show')}function show(i){idx=(i+slides.length)%slides.length;slides.forEach((x,n)=>x.classList.toggle('active',n==idx));ts.forEach((x,n)=>x.classList.toggle('active',n==idx));items.forEach((x,n)=>x.classList.toggle('active',n==idx));bar.style.width=(idx+1)/slides.length*100+'%';ts[idx].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});document.title=String(idx+1).padStart(2,'0')+'｜'+data[idx][0]+'｜进贤仓历史文化街区';closeToc()}function next(){show(idx+1)}function prev(){show(idx-1)}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('home').onclick=()=>show(0);document.getElementById('menu').onclick=()=>{toc.classList.add('open');mask.classList.add('show')};document.getElementById('close').onclick=closeToc;mask.onclick=closeToc;document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();ts.forEach(x=>x.onclick=()=>show(+x.dataset.go));items.forEach(x=>x.onclick=()=>show(+x.dataset.go));document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))next();else if(['ArrowLeft','PageUp'].includes(e.key))prev();else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);else if(e.key==='Escape')closeToc()});document.querySelectorAll('.panel,.card,.num,.step').forEach(x=>x.onclick=e=>{e.stopPropagation();x.classList.toggle('transparent')});show(0);
</script></body></html>
