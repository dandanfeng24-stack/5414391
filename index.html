const deck=document.getElementById('deck'),thumbs=document.getElementById('thumbs'),tocList=document.getElementById('tocList');
function cssPhoto(img){return `url('assets/${img}.jpg')`}function panel(x,i,cls='panel'){return `<div class="${cls}"><div class="meta"><span class="kicker">${x.k}</span><span class="page">${String(i+1).padStart(2,'0')} / ${data.length}</span></div><h1>${x.h}</h1><h2>${x.s}</h2>${x.p?`<p>${x.p}</p>`:''}${x.tags?`<div class="tags">${x.tags.map(t=>`<span>${t}</span>`).join('')}</div>`:''}</div>`}
data.forEach((x,i)=>{let body='';if(x.type==='hero')body=`<div class="content"><div class="frame">${panel(x,i,'panel hero')}</div></div>`;else if(x.type==='feature')body=`<div class="content"><div class="frame">${panel(x,i,'panel feature')}</div></div>`;else if(x.type==='cards')body=`<div class="content"><div class="frame">${panel(x,i)}<div class="grid ${x.items.length===4?'four':'three'}">${x.items.map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div></div></div>`;else if(x.type==='side')body=`<div class="content"><div class="frame split">${panel(x,i)}<div class="card side-card"><h3>鏍稿績瑕佺偣</h3><ul>${x.items.map(c=>`<li>${c}</li>`).join('')}</ul></div></div></div>`;else if(x.type==='nums')body=`<div class="content"><div class="frame">${panel(x,i)}<div class="grid five">${x.items.map((c,n)=>`<div class="num"><strong>${n+1}</strong><span>${c}</span></div>`).join('')}</div></div></div>`;else body=`<div class="content"><div class="frame">${panel(x,i)}<div class="grid five">${x.items.map((c,n)=>`<div class="step"><strong>${String(n+1).padStart(2,'0')}</strong><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div></div></div>`;deck.insertAdjacentHTML('beforeend',`<section class="slide ${i?'':'active'}" style="--photo:${cssPhoto(x.img)}" data-title="${x.t}"><div class="bg"></div><div class="shade"></div><div class="texture"></div>${body}</section>`);thumbs.insertAdjacentHTML('beforeend',`<button class="thumb ${i?'':'active'}" style="--photo:${cssPhoto(x.img)}" data-go="${i}">${String(i+1).padStart(2,'0')}</button>`);tocList.insertAdjacentHTML('beforeend',`<button class="toc-item ${i?'':'active'}" data-go="${i}"><span>${String(i+1).padStart(2,'0')}</span>${x.t}</button>`)});
const slides=[...document.querySelectorAll('.slide')],ts=[...document.querySelectorAll('.thumb')],items=[...document.querySelectorAll('.toc-item')],bar=document.getElementById('progress'),toc=document.getElementById('toc'),mask=document.getElementById('mask');let idx=0;function closeToc(){toc.classList.remove('open');mask.classList.remove('show')}function show(i){idx=(i+slides.length)%slides.length;slides.forEach((x,n)=>x.classList.toggle('active',n===idx));ts.forEach((x,n)=>x.classList.toggle('active',n===idx));items.forEach((x,n)=>x.classList.toggle('active',n===idx));bar.style.width=(idx+1)/slides.length*100+'%';ts[idx].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});document.title=String(idx+1).padStart(2,'0')+'锝?+data[idx].t+'锝滆繘璐や粨鍘嗗彶鏂囧寲琛楀尯';closeToc()}function next(){show(idx+1)}function prev(){show(idx-1)}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('home').onclick=()=>show(0);document.getElementById('menu').onclick=()=>{toc.classList.add('open');mask.classList.add('show')};document.getElementById('close').onclick=closeToc;mask.onclick=closeToc;document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();ts.forEach(x=>x.onclick=()=>show(+x.dataset.go));items.forEach(x=>x.onclick=()=>show(+x.dataset.go));document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))next();else if(['ArrowLeft','PageUp'].includes(e.key))prev();else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);else if(e.key==='Escape')closeToc()});document.querySelectorAll('.panel,.card,.num,.step').forEach(x=>x.onclick=e=>{e.stopPropagation();const on=x.classList.contains('transparent');document.querySelectorAll('.transparent').forEach(y=>y.classList.remove('transparent'));if(!on)x.classList.add('transparent')});document.addEventListener('click',e=>{if(!e.target.closest('.panel,.card,.num,.step'))document.querySelectorAll('.transparent').forEach(y=>y.classList.remove('transparent'))});show(0);
